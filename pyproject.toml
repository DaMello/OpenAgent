[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-local"
version = "0.1.0"
description = "Local-first open-source personal agent harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27.0",
  "keyring>=25.2.0",
  "playwright>=1.51.0",
]

[project.scripts]
openagent = "openagent.__main__:main"

[tool.setuptools.packages.find]
include = ["openagent*"]
